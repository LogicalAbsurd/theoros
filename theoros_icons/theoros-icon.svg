<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Theoros — theta-as-aperture. Charcoal field (#171D22), slate-blue symbol (#556D7C). -->
  <rect width="96" height="96" rx="20" fill="#171D22"/>
  <!-- Outer ring of the theta -->
  <ellipse cx="48" cy="48" rx="24" ry="30"
           fill="none" stroke="#556D7C" stroke-width="7"/>
  <!-- Horizontal bar — the theta crossbar / aperture slit -->
  <line x1="32" y1="48" x2="64" y2="48"
        stroke="#556D7C" stroke-width="7" stroke-linecap="round"/>
</svg>
