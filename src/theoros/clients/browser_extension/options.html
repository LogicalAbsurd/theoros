<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Theoros — Exclusions</title>
  <style>
    body {
      max-width: 480px;
      margin: 24px auto;
      padding: 0 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 15px;
      margin: 20px 0 8px;
    }
    .list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .list li span {
      word-break: break-all;
    }
    .list .remove-btn {
      background: none;
      border: none;
      color: #c62828;
      cursor: pointer;
      font-size: 13px;
      margin-left: 12px;
      white-space: nowrap;
    }
    .list .remove-btn:hover {
      text-decoration: underline;
    }
    .empty {
      color: #757575;
      font-style: italic;
      margin: 4px 0;
    }
    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-row input {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .add-row button {
      padding: 6px 14px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      background: #f5f5f5;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .add-row button:hover {
      background: #e0e0e0;
    }
    .error {
      color: #c62828;
      font-size: 12px;
      margin-top: 4px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Theoros — Exclusions</h1>

  <h2>Excluded domains</h2>
  <ul id="domain-list" class="list"></ul>
  <div class="add-row">
    <input id="domain-input" type="text" placeholder="e.g. banking.com">
    <button id="domain-add-btn">Add</button>
  </div>
  <div id="domain-error" class="error"></div>

  <h2>Excluded path prefixes</h2>
  <ul id="prefix-list" class="list"></ul>
  <div class="add-row">
    <input id="prefix-input" type="text" placeholder="e.g. example.com/admin">
    <button id="prefix-add-btn">Add</button>
  </div>
  <div id="prefix-error" class="error"></div>

  <script src="options.js"></script>
</body>
</html>
