[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theoros"
version = "0.1.0"
description = "Personal AI witness system"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [
    { name = "LogicalAbsurd" },
]

# Runtime deps intentionally empty for now; requirements.txt is the
# canonical dependency list until we're ready to migrate them here.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"theoros.db" = ["migrations/*.sql"]
